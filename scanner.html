function finish(text) {
  if (done) return; done = true;
  if (stream) stream.getTracks().forEach(t => t.stop());
  txt.textContent = '✅ ' + text.slice(0, 80); status('Code lu : envoi au bot…');

  if (tg) { try { tg.sendData(text); } catch(e) { status('Erreur envoi : ' + e); done = false; } }
}

function loadJsQR() {
  const urls = ['https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js',
                'https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js',
                'https://unpkg.com/jsqr@1.4.0/dist/jsQR.js'];
  return new Promise(res => {
    let i = 0;
    const next = () => {
      if (window.jsQR) { jsState = 'ok'; return res(true); }
      if (i >= urls.length) { jsState = 'fail'; return res(false); }
      const s = document.createElement('script'); s.src = urls[i++]; let fin = false;
      const go = ok => { if (fin) return; fin = true; clearTimeout(t); ok ? (jsState = 'ok', res(true)) : next(); };
      const t = setTimeout(() => go(false), 6000);
      s.onload = () => go(!!window.jsQR); s.onerror = () => go(false);
      document.head.appendChild(s);
    };
    next();
  });
}

function decodeCanvas(ctx, w, h) {
  const img = ctx.getImageData(0, 0, w, h);
  const q = window.jsQR(img.data, w, h, {inversionAttempts: 'attemptBoth'});
  return q && q.data ? q.data : '';
}

async function openCamera() {
  const tries = [{video: {facingMode: {ideal: 'environment'}, width: {ideal: 1920}, height: {ideal: 1080}}, audio: false},
                 {video: true, audio: false}];
  let err;
  for (const c of tries) { try { return await navigator.mediaDevices.getUserMedia(c); } catch (e) { err = e; if (e && e.name === 'NotAllowedError') break; } }
  throw err;
}
